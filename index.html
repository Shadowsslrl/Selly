<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selly - Discord Bot</title>
    <style>
        body {
            background-color: #121216;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 50px 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e24;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 {
            color: #b19cd9;
        }
        p {
            color: #b9bbbe;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background-color: #5865F2;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #4752C4;
        }
        .footer-links {
            margin-top: 40px;
            font-size: 14px;
        }
        .footer-links a {
            color: #7289da;
            text-decoration: none;
            margin: 0 15px;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Selly Bot</h1>
        <p>°•` Selly online ✦ Your loyal bot companion for this server. 💜</p>
        
        <!-- HIER DEINEN BOT EINLADUNGS-LINK EINFÜGEN -->
        <a href="https://discord.com/oauth2/authorize?client_id=1546470329675685968" class="btn" target="_blank">Selly einladen</a>

        <div class="footer-links">
            <a href="#privacy">Datenschutz</a>
            <a href="#terms">Nutzungsbedingungen</a>
        </div>
    </div>
</body>
</html>
